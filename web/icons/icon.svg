<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Umbra IA">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#2b231c"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="moon" x1="20%" y1="5%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#ffe6ad"/>
      <stop offset="45%" stop-color="#f5b23e"/>
      <stop offset="100%" stop-color="#c07c1c"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="256" cy="252" r="132" fill="#fff"/>
      <circle cx="300" cy="240" r="120" fill="#000"/>
    </mask>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="196" fill="#f5b23e" fill-opacity="0.07"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#f5b23e" stroke-opacity="0.28" stroke-width="3"/>
  <g filter="url(#glow)">
    <circle cx="256" cy="252" r="132" fill="url(#moon)" mask="url(#crescent)"/>
  </g>
</svg>
