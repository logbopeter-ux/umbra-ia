<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Connexion — Umbra IA</title>
    <meta name="theme-color" content="#100d0c" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { display: grid; place-items: center; min-height: 100dvh; padding: 24px; }
      .gate {
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid var(--border-strong);
        border-radius: 22px;
        padding: 30px 26px 26px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      .gate img { border-radius: 50%; box-shadow: var(--glow); margin-bottom: 14px; }
      .gate h1 { font-family: var(--font-display); font-weight: 400; font-size: 34px; margin-bottom: 6px; }
      .gate p { color: var(--fg-muted); font-size: 13.5px; margin: 0 0 22px; }
      .gate form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
      .gate label { font-size: 13px; color: var(--fg-soft); display: flex; flex-direction: column; gap: 6px; }
      .gate input {
        background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
        padding: 12px 14px; font-size: 15px; outline: none; width: 100%;
      }
      .gate input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245, 178, 62, 0.12); }
      .gate button {
        margin-top: 4px; background: var(--accent); color: var(--accent-ink); border: 0;
        border-radius: 10px; padding: 12px; font-weight: 700; font-size: 15px; cursor: pointer;
      }
      .gate button:disabled { opacity: 0.6; cursor: progress; }
      .gate .msg { min-height: 20px; font-size: 13px; color: var(--danger); margin-top: 10px; }
      .gate footer { margin-top: 18px; font-size: 11.5px; color: var(--fg-muted); }
    </style>
  </head>
  <body>
    <main class="gate">
      <img src="/icons/icon.svg" alt="" width="72" height="72" />
      <h1>Umbra IA</h1>
      <p>Cet espace est privé. Entre le mot de passe pour continuer.</p>

      <form id="form">
        <label>
          Mot de passe
          <input id="password" type="password" autocomplete="current-password" autofocus required />
        </label>
        <button id="submit" type="submit">Entrer</button>
      </form>

      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <footer>Protégé par un cookie de session chiffré · Umbra IA 2.0</footer>
    </main>

    <script>
      const form = document.getElementById('form');
      const input = document.getElementById('password');
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.style.color = '';
        msg.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Vérification…';
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: input.value }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            // Revenir à la page demandée (ex. /apk pour télécharger l'APK),
            // sinon à l'application.
            const suite = new URLSearchParams(location.search).get('next');
            window.location.replace(suite && suite.startsWith('/') ? suite : '/');
            return;
          }
          msg.textContent = data.error || 'Connexion impossible.';
          if (typeof data.remaining === 'number' && data.remaining > 0) {
            msg.textContent += ` (${data.remaining} essai${data.remaining > 1 ? 's' : ''} restant${data.remaining > 1 ? 's' : ''})`;
          }
          input.select();
        } catch {
          msg.textContent = 'Le serveur ne répond pas.';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Entrer';
        }
      });
    </script>
  </body>
</html>
