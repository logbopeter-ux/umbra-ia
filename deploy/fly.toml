# ─────────────────────────────────────────────────────────────
#  Umbra IA — déploiement Fly.io
#
#    fly launch --copy-config --name umbra-ia
#    fly secrets set UMBRA_PASSWORD="..." UMBRA_SESSION_SECRET="$(openssl rand -hex 32)"
#    fly secrets set LLM_API_KEY="..."        # facultatif (mode démo sinon)
#    fly deploy
#    fly open
#
#  Volume persistant (notes + mémoire) :
#    fly volumes create umbra_data --size 1 --region cdg
#  puis décommente le bloc [mounts] ci-dessous et relance `fly deploy`.
# ─────────────────────────────────────────────────────────────
app = "umbra-ia"
primary_region = "cdg" # Paris

[build]
  dockerfile = "../Dockerfile"

[env]
  PORT = "4173"
  HOST = "0.0.0.0"
  UMBRA_PUBLIC_MODE = "1"
  UMBRA_TOOLS_DISABLE = "run_python,browser_control,system_command"
  UMBRA_ALLOW_SHELL = "0"
  UMBRA_TIMEZONE = "Africa/Porto-Novo"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 4173
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"

# [mounts]
#   source = "umbra_data"
#   destination = "/app/data"
