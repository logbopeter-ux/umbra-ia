# ─────────────────────────────────────────────────────────────
#  Umbra IA 2.1 — déploiement Render.com
#
#  Ce fichier est lu automatiquement par Render (« Blueprint »).
#  Il décrit tout : l'image, le port, la santé, les variables.
#
#  Marche à suivre complète : docs/DEPLOYER-RENDER.md
#
#  ⚠️ Sur l'offre gratuite, le disque n'est PAS persistant : les notes,
#  les captures et les pièces jointes sont perdues à chaque redéploiement.
#  Les conversations, elles, vivent dans le navigateur : rien ne se perd
#  de ce côté. Pour garder les fichiers, passe au plan Starter et
#  décommente le bloc « disk » à la fin.
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: umbra-ia
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    # Déploiement manuel : rien ne part tant que tu ne cliques pas sur
    # « Manual Deploy ». Passe à true pour déployer à chaque git push.
    autoDeploy: false
    envVars:
      # ── obligatoire : sans ce mot de passe, l'instance est ouverte ──
      - key: UMBRA_PASSWORD
        sync: false # Render te demande la valeur au premier déploiement
      - key: UMBRA_SESSION_SECRET
        generateValue: true # généré une fois, conservé : les sessions survivent aux redéploiements

      # ── sécurité : les outils dangereux restent éteints en ligne ──
      - key: UMBRA_PUBLIC_MODE
        value: "1"
      - key: UMBRA_TOOLS_DISABLE
        value: "run_python,browser_control,system_command"
      - key: UMBRA_ALLOW_SHELL
        value: "0"

      # ── personnalisation ──
      - key: UMBRA_USER_NAME
        value: Monsieur
      - key: UMBRA_TIMEZONE
        value: Africa/Porto-Novo

      # ── le cerveau principal (sans clé : mode démo, l'app reste utilisable) ──
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash

      # ── secours automatiques : un fournisseur sans clé est ignoré ──
      - key: OLLAMA_ENABLED
        value: "0" # aucun Ollama sur un serveur distant
      - key: LLM_FALLBACKS
        value: "groq,claude"
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── l'APK n'est pas dans l'image (3,9 Mo inutiles sur un serveur) ──
      # Inutile de renseigner quoi que ce soit : /apk déduit tout seul
      # l'adresse de la version publiée sur GitHub (tag v<version>).
      # Cette variable ne sert qu'à imposer une autre adresse (Drive…).
      - key: UMBRA_APK_URL
        sync: false

    # ── Persistance des fichiers (plan Starter, 7 $/mois) ──
    # Décommente pour que notes, captures et pièces jointes survivent.
    # Rien d'autre à faire : docker-entrypoint.sh redonne /app/data à
    # l'utilisateur « node » au démarrage (un disque Render appartient à root).
    # disk:
    #   name: umbra-data
    #   mountPath: /app/data
    #   sizeGB: 1
