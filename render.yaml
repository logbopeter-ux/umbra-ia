# ─────────────────────────────────────────────────────────────
#  Umbra IA — déploiement Render.com (offre gratuite possible)
#
#  1. Pousse ce dossier sur GitHub (dépôt privé de préférence).
#  2. Sur https://dashboard.render.com → « New » → « Blueprint »
#     → choisis ton dépôt. Render lit CE fichier (à la racine du dépôt).
#  3. Il te demande UMBRA_PASSWORD et LLM_API_KEY : remplis-les.
#  4. Umbra sera en ligne sur https://umbra-<quelquechose>.onrender.com
#     (protégée par mot de passe).
#
#  ⚠️ Offre gratuite : pas de disque, les NOTES sont perdues à chaque
#  réveil/redéploiement. (Les souvenirs « remember » sont stockés dans le
#  navigateur, donc déjà persistants.) Le plan Starter (7 $/mois) active
#  le disque « umbra-data » ci-dessous.
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: umbra-ia
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # disque persistant = plan payant obligatoire
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: UMBRA_PASSWORD # obligatoire : sinon Umbra refuse de démarrer
        sync: false # Render te demandera la valeur
      - key: UMBRA_SESSION_SECRET # généré automatiquement
        generateValue: true
      - key: UMBRA_PUBLIC_MODE
        value: "1"
      - key: UMBRA_TOOLS_DISABLE
        value: "run_python,browser_control,system_command"
      - key: UMBRA_USER_NAME
        value: Monsieur
      - key: UMBRA_TIMEZONE
        value: Africa/Porto-Novo
      - key: LLM_API_KEY # pour la vraie IA (facultatif : mode démo sinon)
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash
    # ── Persistance des notes (plan Starter minimum) ──
    # Le disque est monté en root:root par Render : c'est docker-entrypoint.sh
    # qui redonne /app/data à l'utilisateur « node » au démarrage.
    disk:
      name: umbra-data
      mountPath: /app/data
      sizeGB: 1
